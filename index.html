<style>
/* Layout : barre du haut (marque, familles, recherche, thème, langue) ; accueil avec une question d'essai jouable ; pages d'examen avec sommaire à gauche ; colonne de lecture à ~72 caractères. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --sunk: #eef1f5;
  --ink: #141b2b;
  --muted: #586275;
  --line: #dce1e9;
  --accent: #2f54d6;
  --accent-soft: #e5ebfc;
  --ok: #19774a; --ok-soft: #dff1e7;
  --bad: #b0352b; --bad-soft: #f8e2df;
  --warn: #8a5a00; --warn-soft: #fbf0d8;
  --fam-claude: #b4532a; --fam-copilot: #0e7c86; --fam-github: #3d4a5c; --fam-power-platform: #7a3fa0; --fam-azure: #1f6fc0;
  --shadow: 0 1px 2px rgba(20, 27, 43, 0.06), 0 8px 24px rgba(20, 27, 43, 0.08);
  --glow: rgba(47, 84, 214, 0.14);
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --surface: #151c27; --sunk: #1b2330; --ink: #e6eaf1; --muted: #9aa4b6; --line: #27313f;
    --accent: #93a8ff; --accent-soft: #212a47; --ok: #5ccb92; --ok-soft: #15301f; --bad: #f0897d; --bad-soft: #3a1c19;
    --warn: #e7c06c; --warn-soft: #322811;
    --fam-claude: #e0875f; --fam-copilot: #4cc2cc; --fam-github: #b4bfcf; --fam-power-platform: #c08ae0; --fam-azure: #6fb0f0;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
    --glow: rgba(147, 168, 255, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #151c27; --sunk: #1b2330; --ink: #e6eaf1; --muted: #9aa4b6; --line: #27313f;
  --accent: #93a8ff; --accent-soft: #212a47; --ok: #5ccb92; --ok-soft: #15301f; --bad: #f0897d; --bad-soft: #3a1c19;
  --warn: #e7c06c; --warn-soft: #322811;
  --fam-claude: #e0875f; --fam-copilot: #4cc2cc; --fam-github: #b4bfcf; --fam-power-platform: #c08ae0; --fam-azure: #6fb0f0;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
  --glow: rgba(147, 168, 255, 0.16);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; transition: background-color .3s, color .3s; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.25; text-wrap: balance; margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--f-mono); font-size: 0.86em; background: var(--sunk); padding: 0.1em 0.35em; border-radius: 4px; }
pre { background: var(--sunk); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
pre code { background: none; padding: 0; }
[data-fam="claude"] { --fam: var(--fam-claude); }
[data-fam="copilot"] { --fam: var(--fam-copilot); }
[data-fam="github"] { --fam: var(--fam-github); }
[data-fam="power-platform"] { --fam: var(--fam-power-platform); }
[data-fam="azure"] { --fam: var(--fam-azure); }

/* Barre du haut */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 800 0.8rem var(--f-display); letter-spacing: -0.02em; transition: transform .35s var(--ease); }
.brand:hover .brand-mark { transform: rotate(-8deg) scale(1.06); }
.brand b { font: 800 1.05rem var(--f-display); letter-spacing: -0.01em; }
.fams { display: flex; gap: 2px; flex-wrap: nowrap; }
.fams a { font-size: 0.9rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; gap: 7px; transition: background-color .2s, color .2s; }
.fams a::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--fam); transition: transform .25s var(--ease); }
.fams a:hover::before, .fams a.active::before { transform: rotate(45deg) scale(1.15); }
.fams a:hover, .fams a.active { background: var(--sunk); color: var(--ink); }
.search { position: relative; margin-left: auto; flex: 0 1 240px; min-width: 0; }
.search input { width: 100%; font: inherit; font-size: 0.92rem; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); outline: none; }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 20; display: flex; flex-direction: column; animation: drop .18s var(--ease); }
.results[hidden] { display: none; }
.results a { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 0.9rem; }
.results a:hover, .results a.sel { background: var(--sunk); }
.results a .c { font-family: var(--f-mono); font-size: 0.8rem; color: var(--fam); font-weight: 500; }
.results p { margin: 6px 10px; color: var(--muted); font-size: 0.88rem; }
.tools { display: flex; gap: 6px; flex: none; }
.tool { height: 34px; min-width: 34px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 0.78rem var(--f-mono); letter-spacing: 0.04em; transition: border-color .2s, transform .2s var(--ease); }
.tool:hover { border-color: var(--accent); }
.tool:active { transform: scale(0.94); }
.tool svg { width: 17px; height: 17px; transition: transform .5s var(--ease); }
.tool.spin svg { transform: rotate(180deg); }
.lang-opt { opacity: 0.45; transition: opacity .2s; }
.lang-opt.on { opacity: 1; color: var(--accent); }

/* Mise en page */
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 32px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.with-side { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow-y: auto; padding-bottom: 12px; }
.side .lbl { font: 600 0.72rem var(--f-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; }
.side a { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; font-size: 0.9rem; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; line-height: 1.35; transition: background-color .2s, color .2s, box-shadow .25s var(--ease); }
.side a:hover { background: var(--surface); color: var(--ink); }
.side a.active { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--fam, var(--accent)); }
.side a small { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); flex: none; }
.side a.read::after { content: "✓"; color: var(--ok); font-size: 0.8rem; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 26px; }
.col { max-width: 780px; display: flex; flex-direction: column; gap: 24px; }

.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.86rem; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs span[aria-hidden] { opacity: 0.6; }
.page-head { display: flex; flex-direction: column; gap: 10px; }
.page-head h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; }
.code-tag { font: 500 0.85rem var(--f-mono); color: var(--fam, var(--accent)); }
.lede { color: var(--muted); font-size: 1.05rem; max-width: 64ch; margin: 0; }
.small { font-size: 0.86rem; color: var(--muted); margin: 0; }
.foot { max-width: 1240px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); font-size: 0.82rem; color: var(--muted); }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 12px 16px; font-size: 0.92rem; }

/* Apparitions */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
@keyframes sheen { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }
.enter > * { animation: rise .45s var(--ease) both; }
.enter > *:nth-child(2) { animation-delay: .05s; } .enter > *:nth-child(3) { animation-delay: .1s; } .enter > *:nth-child(4) { animation-delay: .15s; } .enter > *:nth-child(n+5) { animation-delay: .2s; }
.cards > * { animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms + .1s); }

/* Accueil */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 44px; align-items: center; padding-bottom: 8px; }
.hero h1 { font-size: clamp(2rem, 4.4vw, 3.1rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--fam-claude), var(--fam-copilot), var(--fam-azure), var(--fam-power-platform), var(--fam-claude)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 9s linear infinite; }
.hero .lede { margin-top: 14px; }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 22px; }
.figs div { background: var(--surface); padding: 14px 16px; }
.figs b { display: block; font: 800 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }
.figs span { font-size: 0.82rem; color: var(--muted); }
.try { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.try[hidden] { display: none; }
.try::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--fam, var(--accent)); transition: background-color .4s; }
.try-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.try-head .lbl { font: 600 0.72rem var(--f-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.try-head a { font: 500 0.82rem var(--f-mono); color: var(--fam); text-decoration: none; }
.try .qtext { font-size: 1.02rem; }
.try .opt { font-size: 0.92rem; padding: 9px 12px; }
.try-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 34px; }
.try-foot .small { flex: 1 1 200px; }
.fam-block { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 80px; }
.fam-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-top: 3px solid var(--fam); padding-top: 14px; }
.fam-head h2 { font-size: 1.3rem; font-weight: 800; }
.fam-head p { margin: 0; color: var(--muted); font-size: 0.93rem; flex: 1 1 320px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); min-width: 0; position: relative; transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
.card:hover { border-color: var(--fam); transform: translateY(-3px); box-shadow: var(--shadow); }
.card .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .c { font: 500 0.85rem var(--f-mono); color: var(--fam); }
.card h3 { font-size: 1rem; font-weight: 700; }
.card .meta { font-size: 0.83rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.card .go { position: absolute; right: 14px; bottom: 12px; color: var(--fam); opacity: 0; transform: translateX(-6px); transition: opacity .25s, transform .25s var(--ease); }
.card:hover .go { opacity: 1; transform: none; }
.card.formation { background: var(--sunk); border-style: dashed; }
.chip { font-size: 0.74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ko { background: var(--bad-soft); color: var(--bad); }
.chip.go { background: var(--accent-soft); color: var(--accent); }
.chip.fr { background: var(--warn-soft); color: var(--warn); }
.meter { height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--fam, var(--ok)); transition: width .8s var(--ease); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.how h3 { font-size: 0.98rem; font-weight: 700; margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
.how h3 span { font: 600 0.8rem var(--f-mono); color: var(--accent); }
.how p { margin: 0; color: var(--muted); font-size: 0.92rem; }

/* Page examen */
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.action { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s; }
.action:hover { border-color: var(--fam, var(--accent)); transform: translateY(-2px); box-shadow: var(--shadow); }
.action b { font-family: var(--f-display); font-size: 1rem; }
.action span { font-size: 0.88rem; color: var(--muted); }
.action.main-act { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.action.main-act span { color: var(--surface); opacity: 0.75; }
.domains { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.dom { display: grid; grid-template-columns: 44px minmax(0, 1fr) 120px; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); transition: background-color .2s, padding-left .25s var(--ease); }
.dom:last-child { border-bottom: 0; }
.dom:hover { background: var(--sunk); padding-left: 20px; }
.dom .k { font: 500 0.85rem var(--f-mono); color: var(--muted); }
.dom .w { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dom .pct { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }

/* Markdown */
.prose { max-width: 72ch; }
.prose > * + * { margin-top: 0.85em; }
.prose h2, .prose h3 { font-size: 1.15rem; margin-top: 1.6em; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: 0.35em; }
.prose li > p { margin: 0; }
.prose blockquote { margin: 0; padding: 12px 16px; border-left: 3px solid var(--fam, var(--accent)); background: var(--surface); border-radius: 0 8px 8px 0; }
.prose blockquote p { margin: 0; }
.prose input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--ok); margin-right: 8px; vertical-align: -2px; }
.prose ul:has(> li > input[type=checkbox]), .prose ul:has(> li > p > input[type=checkbox]) { list-style: none; padding-left: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
.table-wrap th, .table-wrap td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table-wrap tr:last-child td { border-bottom: 0; }
.table-wrap th { font-weight: 600; font-size: 0.82rem; background: var(--sunk); white-space: nowrap; }

/* Boutons */
.btn { font: 600 0.92rem var(--f-body); border-radius: 8px; padding: 9px 15px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: border-color .2s, transform .15s var(--ease), box-shadow .2s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { box-shadow: 0 6px 18px var(--glow); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.small-btn { padding: 6px 11px; font-size: 0.84rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Questions */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.qcount { font: 500 0.85rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.qbar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }

  function dial(score, seuil, pass) {
    var r = 54, c = 2 * Math.PI * r, a = (seuil / 1000) * 2 * Math.PI - Math.PI / 2;
    var mx = 66 + Math.cos(a) * 46, my = 66 + Math.sin(a) * 46, mx2 = 66 + Math.cos(a) * 62, my2 = 66 + Math.sin(a) * 62;
    return '<svg class="dial' + (pass ? "" : " fail") + '" viewBox="0 0 132 132" role="img" aria-label="' + score + '/1000"><circle class="trk" cx="66" cy="66" r="' + r + '"/><circle class="val" id="dialval" cx="66" cy="66" r="' + r + '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (REDUCED ? (c * (1 - score / 1000)).toFixed(1) : c.toFixed(1)) + '" data-to="' + (c * (1 - score / 1000)).toFixed(1) + '"/><line class="mark" x1="' + mx.toFixed(1) + '" y1="' + my.toFixed(1) + '" x2="' + mx2.toFixed(1) + '" y2="' + my2.toFixed(1) + '"/><text x="66" y="66" id="dialnum" data-to="' + score + '">' + score + "</text></svg>";
  }
  function finishMock() {
    clearInterval(tick);
    var e = mockExam(), all = examQuestions(e), byN = {}; all.forEach(function (q) { byN[q.n] = q; });
    var ok = 0, perDom = {};
    e.domaines.forEach(function (d) { perDom[d.id] = { nom: d.nom, ok: 0, total: 0 }; });
    var r = res(e.id);
    M.items.forEach(function (x) { var q = byN[x.n], good = M.ans[x.n] === q.a; if (good) ok++; perDom[q.dom].total++; if (good) perDom[q.dom].ok++; r[x.n] = good; });
    var total = M.items.length, score = Math.round(1000 * ok / total);
    (S.mocks[e.id] = S.mocks[e.id] || []).push({ d: Date.now(), score: score, ok: ok, total: total });
    if (S.mocks[e.id].length > 20) S.mocks[e.id].shift();
    var done = M; S.cur = null; M = null; save();
    var pass = score >= e.seuil;
    var doms = e.domaines.map(function (d) {
      var p = perDom[d.id], pct = p.total ? Math.round(100 * p.ok / p.total) : 0;
      return '<div class="' + (pct < 70 ? "weak" : "") + '"><a href="#' + e.id + "-" + d.id + '">' + esc(p.nom) + '</a><div class="meter"><i style="width:' + pct + '%"></i></div><span>' + p.ok + "/" + p.total + "</span></div>";
    }).join("");
    var rev = done.items.map(function (x, k) {
      var q = byN[x.n], pick = done.ans[x.n], good = pick === q.a, a = q.options.filter(function (o) { return o.l === q.a; })[0], p = q.options.filter(function (o) { return o.l === pick; })[0];
      return '<details' + (good ? "" : " open") + '><summary><span class="st ' + (good ? "ok-t" : "ko-t") + '">' + (good ? "✓" : "✗") + " " + (k + 1) + "</span><span>" + mi(q.q) + '</span></summary><div class="body">' +
        (good ? "" : "<p><b>" + esc(t("yourAns")) + "</b> " + (p ? mi(p.t) : "<i>" + esc(t("none")) + "</i>") + "</p>") + "<p><b>" + esc(t("goodAns")) + "</b> " + mi(a.t) + "</p><p>" + mi(q.why) + '</p><p class="small">' + esc(q.domNom) + ' · <a href="' + esc(q.src) + '" target="_blank" rel="noopener">' + esc(t("source")) + "</a></p></div></details>";
    }).join("");
    var main = examHeader(e, t("mockResult")) +
      '<header class="page-head"><span class="code-tag">' + esc(e.code) + " · " + esc(t("mockExam")) + "</span><h1>" + esc(pass ? t("passed") : t("notYet")) + "</h1></header>" +
      '<div class="score-big">' + dial(score, e.seuil, pass) + '<div class="score-txt"><span class="chip ' + (pass ? "ok" : "ko") + '">' + esc(t("threshold", { s: e.seuil })) + '</span><span class="small">' + esc(t("goodAnswers", { a: ok, b: total })) + "</span></div></div>" +
      '<h2 style="font-size:1.1rem">' + esc(t("byDom")) + '</h2><div class="dom-res">' + doms + '</div><p class="small">' + esc(t("weakHint")) + "</p>" +
      '<div class="row"><a class="btn dark" href="#' + e.id + '-erreurs">' + esc(t("reviewMistakes")) + '</a><a class="btn" href="#' + e.id + '-examen">' + esc(t("newMock")) + "</a></div>" +
      '<h2 style="font-size:1.1rem">' + esc(t("details")) + '</h2><div class="review">' + rev + "</div>";
    setView(sideWrap(examSide(e, "examen"), '<div class="col">' + main + "</div>"), e.famille);
    bindSide();
    if (!REDUCED) {
      var v = document.getElementById("dialval"), num = document.getElementById("dialnum");
      requestAnimationFrame(function () { requestAnimationFrame(function () { v.style.strokeDashoffset = v.dataset.to; }); });
      countUp(num);
    }
    if (location.hash !== "#" + e.id + "-resultat") history.replaceState(null, "", "#" + e.id + "-resultat");
    document.title = t("resultTitle", { s: score }) + " · " + e.code;
  }

  // ---------- Formations Claude (carnet, en français) ----------
  function frCourse() { return L === "en" ? '<div class="notice">' + esc(t("frCourseNote")) + "</div>" : ""; }
  function formationSide(m, cur) {
    return D.formations.map(function (f) {
      var on = f.n === m.n;
      var h = '<a href="#formation-m' + f.n + '" class="' + (on && cur === "" ? "active" : "") + '"><span>' + f.n + ". " + esc(f.title) + "</span></a>";
      if (on) {
        h += f.sections.map(function (s) { return '<a href="#' + s.id.replace(/^m(\d+)-/, "formation-m$1-") + '" class="' + (S.read[s.id] ? "read " : "") + (cur === s.id ? "active" : "") + '" style="padding-left:22px"><span>' + esc(s.title.replace(/^(Leçons?|Parties?|Partie)\s+[^—]+—\s*/, "")) + "</span></a>"; }).join("");
        h += '<a href="#formation-m' + f.n + '-quiz" class="' + (cur === "quiz" ? "active" : "") + '" style="padding-left:22px"><span>' + esc(t("quiz")) + "</span><small>" + f.quiz.length + "</small></a>";
      }
      return h;
    }).join("");
  }
  function fCrumbs(m, sub) { return crumbs([[t("home"), "accueil"], ["Claude", "famille-claude"], [t("course") + " " + m.n, sub ? "formation-m" + m.n : null]].concat(sub ? [[sub]] : [])); }
  function viewFormation(m) {
    var main = fCrumbs(m) + '<header class="page-head"><span class="code-tag">' + esc(t("fTag", { n: m.n, d: m.duration })) + "</span><h1>" + esc(m.title) + "</h1></header>" + frCourse() + '<div class="prose">' + md(m.intro) + "</div>" +
      '<div class="actions">' + m.sections.map(function (s) { return '<a class="action" href="#' + s.id.replace(/^m(\d+)-/, "formation-m$1-") + '"><b>' + esc(s.title) + "</b><span>" + esc(S.read[s.id] ? t("read") : t("toRead")) + "</span></a>"; }).join("") +
      '<a class="action main-act" href="#formation-m' + m.n + '-quiz"><b>' + esc(t("courseQuiz")) + "</b><span>" + esc(t("nQs", { n: m.quiz.length })) + "</span></a></div>";
    setView(sideWrap(formationSide(m, ""), '<div class="col">' + main + "</div>"), "claude");
    bindSide();
    document.title = m.title + " · Claude";
  }
  function viewFSection(m, s) {
    var idx = m.sections.indexOf(s), next = m.sections[idx + 1];
    var main = fCrumbs(m, s.title) + '<header class="page-head"><span class="code-tag">' + esc(t("course")) + " " + m.n + " · " + esc(m.title) + "</span><h1>" + esc(s.title) + "</h1></header>" + frCourse() +
      '<article class="prose">' + md(s.md) + "</article>" +
      '<div class="row"><button class="btn" id="mark" type="button"></button>' + (next ? '<a class="btn" href="#' + next.id.replace(/^m(\d+)-/, "formation-m$1-") + '">' + esc(t("nextSection")) + "</a>" : '<a class="btn dark" href="#formation-m' + m.n + '-quiz">' + esc(t("courseQuiz")) + " →</a>") + "</div>";
    setView(sideWrap(formationSide(m, s.id), '<div class="col">' + main + "</div>"), "claude");
    bindSide();
    view.querySelectorAll(".prose input[type=checkbox]").forEach(function (c) { c.disabled = false; });
    var b = document.getElementById("mark");
    function paint() { var rd = !!S.read[s.id]; b.textContent = rd ? t("isRead") : t("markRead"); b.className = "btn" + (rd ? " done" : ""); }
    paint(); b.addEventListener("click", function () { S.read[s.id] = !S.read[s.id]; save(); paint(); });
    document.title = s.title + " · Claude";
  }

  // ---------- Routage ----------
  function routeTo(h) { if (location.hash === "#" + h) route(); else location.hash = "#" + h; }
  function route() {
    if (!D) return;
    var h = decodeURIComponent((location.hash || "").replace(/^#/, "")) || "accueil", m;
    if (M && !(h === M.id + "-examen")) { clearInterval(tick); M = null; }
    P = null;
    var fam = null;
    if (h === "infos") viewInfos();
    else if ((m = h.match(/^famille-(.+)$/)) && FAM[m[1]]) { fam = m[1]; viewFamily(FAM[m[1]]); }
    else if ((m = h.match(/^formation-m(\d+)(?:-(.+))?$/)) && D.formations[+m[1] - 1]) {
      fam = "claude";
      var fm = D.formations[+m[1] - 1], rest = m[2] || "", key = "formation-m" + fm.n;
      var side = function (c) { return formationSide(fm, c); };
      if (!rest) viewFormation(fm);
      else if (/^s\d+$/.test(rest) && fm.sections.filter(function (s) { return s.id === "m" + fm.n + "-" + rest; })[0]) viewFSection(fm, fm.sections.filter(function (s) { return s.id === "m" + fm.n + "-" + rest; })[0]);
      else if (rest === "quiz" || rest === "erreurs") {
        var all = formationQuestions(fm), items = rest === "quiz" ? all : stats(key, all).missed;
        startPractice({ key: key, items: items, back: "formation-m" + fm.n, errHash: "formation-m" + fm.n + "-erreurs", fam: "claude", side: side("quiz"),
          crumbs: fCrumbs(fm, rest === "quiz" ? t("quiz") : t("errorsCrumb")), label: t("fTag", { n: fm.n, d: fm.duration }), title: rest === "quiz" ? t("courseQuiz") : t("reviewMistakes") });
      } else viewFormation(fm);
    } else {
      var e = null;
      D.examens.forEach(function (x) { if (h === x.id || h.indexOf(x.id + "-") === 0) e = x; });
      if (e) {
        fam = e.famille;
        var r = h.slice(e.id.length + 1), dm = r.match(/^(d\d+)(-entrainement)?$/), dom = dm ? e.domaines.filter(function (d) { return d.id === dm[1]; })[0] : null;
        var qs = examQuestions(e);
        var base = { key: e.id, back: e.id, errHash: e.id + "-erreurs", fam: e.famille, label: e.code + " · " + e.titre };
        if (!r) viewExam(e);
        else if (dom && !dm[2]) viewDomain(e, dom);
        else if (dom && dm[2]) startPractice(Object.assign({}, base, { items: qs.filter(function (q) { return q.dom === dom.id; }), side: examSide(e, dom.id), crumbs: examHeader(e, dom.nom), title: t("practiceOn", { d: dom.nom }) }));
        else if (r === "entrainement") startPractice(Object.assign({}, base, { items: qs, side: examSide(e, "entrainement"), crumbs: examHeader(e, t("practiceT")), title: t("practiceAll") }));
        else if (r === "erreurs") {
          var miss = stats(e.id, qs).missed;
          if (!miss.length) { location.replace("#" + e.id); return; }
          startPractice(Object.assign({}, base, { items: miss, side: examSide(e, "erreurs"), crumbs: examHeader(e, t("errorsCrumb")), title: t("reviewMistakes") }));
        }
        else if (r === "examen") { if (M && M.id === e.id) drawMock(); else viewMockIntro(e); }
        else if (r === "resultat") viewMockIntro(e);
        else viewExam(e);
      } else { viewHome(); }
    }
    renderFams(fam);
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey || /input|textarea/i.test((ev.target.tagName || "")) && ev.target.type !== "checkbox") return;
    var k = ev.key.toLowerCase();
    if (P && !P.done) {
      if (/^[a-d]$/.test(k) && P.picks.length === P.i) { ev.preventDefault(); var x = P.items[P.i].opts.filter(function (o) { return o.l === k; })[0]; if (x) pAnswer(x.orig); }
      else if (k === "enter" && P.picks.length > P.i && document.activeElement && document.activeElement.id !== "next") { ev.preventDefault(); pNext(); }
    } else if (M) {
      if (/^[a-d]$/.test(k)) { ev.preventDefault(); mPick(M.items[M.i].opts["abcd".indexOf(k)]); }
      else if (k === "arrowright" && M.i < M.items.length - 1) { M.i++; save(); drawMock(); }
      else if (k === "arrowleft" && M.i > 0) { M.i--; save(); drawMock(); }
    }
  });
  window.addEventListener("hashchange", route);

  // ---------- Chargement des données de la langue choisie ----------
  function apply(d) { D = d; FAM = {}; EX = {}; d.familles.forEach(function (f) { FAM[f.id] = f; }); d.examens.forEach(function (e) { EX[e.id] = e; }); }
  function load(keepView) {
    var file = L === "en" ? "data-en.json" : "data.json";
    if (CACHE[file]) { apply(CACHE[file]); if (M) M = null; route(); return; }
    if (!keepView) view.innerHTML = '<p class="small">' + esc(t("loading")) + "</p>";
    fetch(file).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
      CACHE[file] = d; apply(d); if (M) M = null; route();
    }).catch(function () {
      view.innerHTML = '<p class="notice">' + esc(t("loadErr")) + "</p>";
    });
  }
  paintChrome();
  load(false);
})();
</script>
</body>
