<style>
/* Layout : barre du haut (marque, recherche, familles) ; pages d'examen avec un sommaire à gauche ; colonne de lecture à ~72 caractères. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --sunk: #eef1f5;
  --ink: #141b2b;
  --muted: #586275;
  --line: #dce1e9;
  --accent: #2f54d6;
  --accent-soft: #e5ebfc;
  --ok: #19774a; --ok-soft: #dff1e7;
  --bad: #b0352b; --bad-soft: #f8e2df;
  --warn: #8a5a00; --warn-soft: #fbf0d8;
  --fam-claude: #b4532a; --fam-copilot: #0e7c86; --fam-github: #3d4a5c; --fam-power-platform: #7a3fa0; --fam-azure: #1f6fc0;
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --surface: #151c27; --sunk: #1b2330; --ink: #e6eaf1; --muted: #9aa4b6; --line: #27313f;
    --accent: #93a8ff; --accent-soft: #212a47; --ok: #5ccb92; --ok-soft: #15301f; --bad: #f0897d; --bad-soft: #3a1c19;
    --warn: #e7c06c; --warn-soft: #322811;
    --fam-claude: #e0875f; --fam-copilot: #4cc2cc; --fam-github: #b4bfcf; --fam-power-platform: #c08ae0; --fam-azure: #6fb0f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #151c27; --sunk: #1b2330; --ink: #e6eaf1; --muted: #9aa4b6; --line: #27313f;
  --accent: #93a8ff; --accent-soft: #212a47; --ok: #5ccb92; --ok-soft: #15301f; --bad: #f0897d; --bad-soft: #3a1c19;
  --warn: #e7c06c; --warn-soft: #322811;
  --fam-claude: #e0875f; --fam-copilot: #4cc2cc; --fam-github: #b4bfcf; --fam-power-platform: #c08ae0; --fam-azure: #6fb0f0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.25; text-wrap: balance; margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--f-mono); font-size: 0.86em; background: var(--sunk); padding: 0.1em 0.35em; border-radius: 4px; }
pre { background: var(--sunk); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
pre code { background: none; padding: 0; }
[data-fam="claude"] { --fam: var(--fam-claude); }
[data-fam="copilot"] { --fam: var(--fam-copilot); }
[data-fam="github"] { --fam: var(--fam-github); }
[data-fam="power-platform"] { --fam: var(--fam-power-platform); }
[data-fam="azure"] { --fam: var(--fam-azure); }

/* Barre du haut */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 800 0.8rem var(--f-display); letter-spacing: -0.02em; }
.brand b { font: 800 1.05rem var(--f-display); letter-spacing: -0.01em; }
.fams { display: flex; gap: 4px; flex-wrap: wrap; }
.fams a { font-size: 0.9rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; gap: 7px; }
.fams a::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--fam); }
.fams a:hover, .fams a.active { background: var(--sunk); color: var(--ink); }
.search { position: relative; margin-left: auto; flex: 0 1 260px; min-width: 0; }
.search input { width: 100%; font: inherit; font-size: 0.92rem; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(10, 20, 40, 0.14); padding: 6px; z-index: 20; display: flex; flex-direction: column; }
.results a { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 0.9rem; }
.results a:hover, .results a.sel { background: var(--sunk); }
.results a .c { font-family: var(--f-mono); font-size: 0.8rem; color: var(--fam); font-weight: 500; }
.results p { margin: 6px 10px; color: var(--muted); font-size: 0.88rem; }

/* Mise en page */
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 32px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.with-side { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow-y: auto; padding-bottom: 12px; }
.side .lbl { font: 600 0.72rem var(--f-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; }
.side a { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; font-size: 0.9rem; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; line-height: 1.35; }
.side a:hover { background: var(--surface); color: var(--ink); }
.side a.active { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--fam, var(--accent)); }
.side a small { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); flex: none; }
.side a.read::after { content: "✓"; color: var(--ok); font-size: 0.8rem; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 26px; }
.col { max-width: 780px; display: flex; flex-direction: column; gap: 24px; }

.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.86rem; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs span[aria-hidden] { opacity: 0.6; }
.page-head { display: flex; flex-direction: column; gap: 10px; }
.page-head h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; }
.code-tag { font: 500 0.85rem var(--f-mono); color: var(--fam, var(--accent)); }
.lede { color: var(--muted); font-size: 1.05rem; max-width: 64ch; margin: 0; }
.small { font-size: 0.86rem; color: var(--muted); margin: 0; }
.foot { max-width: 1240px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); font-size: 0.82rem; color: var(--muted); }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 12px 16px; font-size: 0.92rem; }

/* Accueil */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 40px; align-items: end; padding-bottom: 8px; }
.hero h1 { font-size: clamp(2rem, 4.4vw, 3.1rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { margin-top: 14px; }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.figs div { background: var(--surface); padding: 14px 16px; }
.figs b { display: block; font: 800 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }
.figs span { font-size: 0.82rem; color: var(--muted); }
.fam-block { display: flex; flex-direction: column; gap: 14px; }
.fam-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-top: 3px solid var(--fam); padding-top: 14px; }
.fam-head h2 { font-size: 1.3rem; font-weight: 800; }
.fam-head p { margin: 0; color: var(--muted); font-size: 0.93rem; flex: 1 1 320px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.card:hover { border-color: var(--fam); }
.card .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .c { font: 500 0.85rem var(--f-mono); color: var(--fam); }
.card h3 { font-size: 1rem; font-weight: 700; }
.card .meta { font-size: 0.83rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.card.formation { background: var(--sunk); border-style: dashed; }
.chip { font-size: 0.74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ko { background: var(--bad-soft); color: var(--bad); }
.chip.go { background: var(--accent-soft); color: var(--accent); }
.meter { height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--fam, var(--ok)); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.how h3 { font-size: 0.98rem; font-weight: 700; margin-bottom: 4px; }
.how p { margin: 0; color: var(--muted); font-size: 0.92rem; }

/* Page examen */
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.action { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); }
.action:hover { border-color: var(--fam, var(--accent)); }
.action b { font-family: var(--f-display); font-size: 1rem; }
.action span { font-size: 0.88rem; color: var(--muted); }
.action.main-act { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.action.main-act span { color: var(--surface); opacity: 0.75; }
.domains { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.dom { display: grid; grid-template-columns: 44px minmax(0, 1fr) 120px; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.dom:last-child { border-bottom: 0; }
.dom:hover { background: var(--sunk); }
.dom .k { font: 500 0.85rem var(--f-mono); color: var(--muted); }
.dom .w { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dom .pct { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }

/* Markdown */
.prose { max-width: 72ch; }
.prose > * + * { margin-top: 0.85em; }
.prose h2, .prose h3 { font-size: 1.15rem; margin-top: 1.6em; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: 0.35em; }
.prose li > p { margin: 0; }
.prose blockquote { margin: 0; padding: 12px 16px; border-left: 3px solid var(--fam, var(--accent)); background: var(--surface); border-radius: 0 8px 8px 0; }
.prose blockquote p { margin: 0; }
.prose input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--ok); margin-right: 8px; vertical-align: -2px; }
.prose ul:has(> li > input[type=checkbox]), .prose ul:has(> li > p > input[type=checkbox]) { list-style: none; padding-left: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
.table-wrap th, .table-wrap td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table-wrap tr:last-child td { border-bottom: 0; }
.table-wrap th { font-weight: 600; font-size: 0.82rem; background: var(--sunk); white-space: nowrap; }

/* Boutons */
.btn { font: 600 0.92rem var(--f-body); border-radius: 8px; padding: 9px 15px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn:disabled { opacity: 0.5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Questions */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.qcount { font: 500 0.85rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.qbar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--fam, var(--accent)); transition: width .25s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.qtag { font: 500 0.78rem var(--f-mono); color: var(--muted); }
.qtext { font-family: var(--f-display); font-size: 1.12rem; font-weight: 700; line-height: 1.45; margin: 0; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; font: 400 0.98rem/1.5 var(--f-body); color: var(--ink); background: var(--bg); border: 1.5px solid transparent; border-radius: 8px; padding: 11px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .l { font: 500 0.95rem var(--f-mono); color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.dim { opacity: 0.55; }
.verdict { border-radius: 8px; padding: 12px 16px; font-size: 0.95rem; display: flex; flex-direction: column; gap: 4px; }
.verdict.ok { background: var(--ok-soft); }
.verdict.ko { background: var(--bad-soft); }
.verdict a { font-size: 0.86rem; }
.kbd { font: 0.76rem var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

/* Examen blanc */
.mock-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 5; }
.timer { font: 600 1.2rem var(--f-mono); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.grid-nav { display: flex; flex-wrap: wrap; gap: 6px; }
.grid-nav button { width: 36px; height: 34px; font: 500 0.82rem var(--f-mono); border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; position: relative; }
.grid-nav button.ans { background: var(--accent-soft); border-color: var(--accent); }
.grid-nav button.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.grid-nav button.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.grid-nav button.r-ok { background: var(--ok-soft); border-color: var(--ok); }
.grid-nav button.r-ko { background: var(--bad-soft); border-color: var(--bad); }
.score-big { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.score-big b { font: 800 3.2rem var(--f-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.dom-res { display: flex; flex-direction: column; gap: 10px; }
.dom-res div { display: grid; grid-template-columns: minmax(0, 1fr) 160px 52px; gap: 12px; align-items: center; font-size: 0.9rem; }
.dom-res .meter { height: 8px; }
.dom-res .meter i { background: var(--ok); }
.dom-res .weak .meter i { background: var(--bad); }
.dom-res span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.review { display: flex; flex-direction: column; gap: 14px; }
.review details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.review summary { cursor: pointer; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.review summary .st { flex: none; font-family: var(--f-mono); }
.review .ok-t { color: var(--ok); } .review .ko-t { color: var(--bad); }
.review .body { padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.93rem; }
.review .body p { margin: 0; }
.reset-box { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.reset-confirm { background: var(--bad-soft); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.reset-confirm p { margin: 0; }
.side-toggle { display: none; }

@media (max-width: 900px) {
  .fams { display: none; }
  .hero { grid-template-columns: 1fr; gap: 20px; }
  .with-side { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .side { position: static; max-height: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
  .side-wrap:not(.open) .side { display: none; }
  .side-toggle { display: inline-flex; align-self: flex-start; }
  .dom { grid-template-columns: 34px minmax(0, 1fr); }
  .dom .pct { grid-column: 2; text-align: left; }
  .dom-res div { grid-template-columns: minmax(0, 1fr) 90px 44px; }
  .qcard { padding: 18px; }
  .mock-bar { top: calc(env(safe-area-inset-top, 0px) + 56px); }
}
@media (max-width: 520px) {
  .brand b { display: none; }
  .figs b { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#accueil" aria-label="Prépa Certifs, accueil"><span class="brand-mark">PC</span><b>Prépa Certifs</b></a>
    <nav class="fams" id="fams" aria-label="Familles"></nav>
    <div class="search">
      <input id="q" type="search" placeholder="Chercher un examen : AZ-104, Copilot…" autocomplete="off" aria-label="Chercher un examen ou une formation">
      <div class="results" id="results" hidden></div>
    </div>
  </div>
</header>
<div class="wrap" id="view"><p class="small">Chargement…</p></div>
<footer class="foot">Site indépendant, non affilié à Microsoft, GitHub ni Anthropic. Les questions sont rédigées à partir de la documentation officielle, citée sous chaque réponse. Vérifie toujours le programme officiel avant ton examen.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  "use strict";
  var D = null, EX = {}, FAM = {};
  var view = document.getElementById("view");

  // ---------- Stockage local (navigateur du visiteur) ----------
  var KEY = "prepa-certifs:v1";
  function blank() { return { q: {}, mocks: {}, read: {}, cur: null }; }
  var S = blank();
  try { var raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function res(key) { return S.q[key] || (S.q[key] = {}); }

  // ---------- Utilitaires ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function md(s) { return window.marked ? marked.parse(s || "", { gfm: true }) : "<p>" + esc(s) + "</p>"; }
  function mi(s) { return window.marked ? marked.parseInline(s || "", { gfm: true }) : esc(s); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function enhance(root) {
    if (!root) return;
    root.querySelectorAll("a[href^='http']").forEach(function (a) { a.target = "_blank"; a.rel = "noopener"; });
    root.querySelectorAll("table").forEach(function (t) { var w = document.createElement("div"); w.className = "table-wrap"; t.parentNode.insertBefore(w, t); w.appendChild(t); });
  }
  function crumbs(list) {
    return '<nav class="crumbs" aria-label="Fil d\'Ariane">' + list.map(function (c, i) {
      return (i ? '<span aria-hidden="true">/</span>' : "") + (c[1] ? '<a href="#' + c[1] + '">' + esc(c[0]) + "</a>" : "<span>" + esc(c[0]) + "</span>");
    }).join("") + "</nav>";
  }
  function fmtTime(s) { s = Math.max(0, Math.round(s)); var m = Math.floor(s / 60); return (m < 10 ? "0" : "") + m + ":" + (s % 60 < 10 ? "0" : "") + (s % 60); }
  function pw(d) { return d.poids[0] === d.poids[1] ? String(d.poids[0]) : d.poids[0] + "–" + d.poids[1]; }
  function plural(n, w) { return n + " " + w + (n > 1 ? "s" : ""); }
  function setView(html, fam) { view.innerHTML = html; view.setAttribute("data-fam", fam || ""); enhance(view); window.scrollTo(0, 0); }
  function sideWrap(sideHtml, mainHtml) {
    return '<div class="with-side"><div class="side-wrap" id="sidewrap"><button class="btn side-toggle" type="button" id="sidetog" aria-expanded="false">Sommaire</button><nav class="side" aria-label="Sommaire">' + sideHtml + '</nav></div><div class="main">' + mainHtml + "</div></div>";
  }
  function bindSide() {
    var t = document.getElementById("sidetog"); if (!t) return;
    t.addEventListener("click", function () { var w = document.getElementById("sidewrap"); var o = w.classList.toggle("open"); t.setAttribute("aria-expanded", o ? "true" : "false"); });
  }

  // ---------- Questions : données dérivées ----------
  function famExams(fid) { var a = D.examens.filter(function (e) { return e.famille === fid; }); return a.concat(D.examens.filter(function (e) { return e.famille !== fid && inFam(e, fid); })); }
  function inFam(e, fid) { return e.famille === fid || (e.familles_aussi || []).indexOf(fid) !== -1; }
  function examQuestions(e) {
    var out = [];
    e.domaines.forEach(function (d) { d.questions.forEach(function (q) { out.push({ n: q.n, q: q.q, options: q.options, a: q.a, why: q.why, src: q.src, dom: d.id, domNom: d.nom }); }); });
    return out;
  }
  function stats(key, qs) {
    var r = S.q[key] || {}, seen = 0, ok = 0;
    qs.forEach(function (q) { if (r[q.n] != null) { seen++; if (r[q.n]) ok++; } });
    return { seen: seen, ok: ok, total: qs.length, missed: qs.filter(function (q) { return r[q.n] === false; }) };
  }
  function bestMock(id) { var l = S.mocks[id] || []; return l.length ? Math.max.apply(null, l.map(function (m) { return m.score; })) : null; }
  function formationQuestions(m) { return m.quiz.map(function (q) { return { n: q.n, q: q.q, options: q.options, a: q.a, why: q.why, src: null, dom: "quiz", domNom: "Quiz" }; }); }

  // ---------- Barre du haut ----------
  function renderFams(active) {
    document.getElementById("fams").innerHTML = D.familles.map(function (f) {
      return '<a href="#famille-' + f.id + '" data-fam="' + f.id + '" class="' + (active === f.id ? "active" : "") + '">' + esc(f.id === "power-platform" ? "Power Platform" : f.nom) + "</a>";
    }).join("");
  }
  var qInput = document.getElementById("q"), qRes = document.getElementById("results"), qSel = -1;
  function searchItems() {
    var items = D.examens.map(function (e) { return { href: e.id, c: e.code, t: e.titre, fam: e.famille, hay: (e.code + " " + e.titre + " " + FAM[e.famille].nom + " " + e.niveau + " " + (e.mots_cles || "")).toLowerCase() }; });
    D.formations.forEach(function (m) { items.push({ href: "formation-m" + m.n, c: "Cours " + m.n, t: m.title, fam: "claude", hay: ("formation cours claude academy " + m.title).toLowerCase() }); });
    return items;
  }
  function runSearch() {
    var v = qInput.value.trim().toLowerCase();
    if (!v) { qRes.hidden = true; return; }
    var words = v.split(/\s+/);
    var hits = searchItems().filter(function (it) { return words.every(function (w) { return it.hay.indexOf(w) !== -1; }); }).slice(0, 8);
    qSel = -1;
    qRes.innerHTML = hits.length ? hits.map(function (h) { return '<a href="#' + h.href + '" data-fam="' + h.fam + '"><span class="c">' + esc(h.c) + "</span><span>" + esc(h.t) + "</span></a>"; }).join("") : "<p>Aucun examen ne correspond.</p>";
    qRes.hidden = false;
  }
  qInput.addEventListener("input", runSearch);
  qInput.addEventListener("keydown", function (e) {
    var links = qRes.querySelectorAll("a");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!links.length) return;
      qSel = (qSel + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length;
      links.forEach(function (l, i) { l.classList.toggle("sel", i === qSel); });
    } else if (e.key === "Enter") {
      var t = links[qSel >= 0 ? qSel : 0]; if (t) { location.hash = t.getAttribute("href"); closeSearch(); }
    } else if (e.key === "Escape") { closeSearch(); }
  });
  function closeSearch() { qRes.hidden = true; qInput.value = ""; qInput.blur(); }
  qRes.addEventListener("click", function (e) { if (e.target.closest("a")) closeSearch(); });
  document.addEventListener("click", function (e) { if (!e.target.closest(".search")) qRes.hidden = true; });

  // ---------- Accueil ----------
  function examCard(e) {
    var qs = examQuestions(e), st = stats(e.id, qs), best = bestMock(e.id);
    var chip = best != null ? (best >= e.seuil ? '<span class="chip ok">Blanc : ' + best + "</span>" : '<span class="chip ko">Blanc : ' + best + "</span>") : (st.seen ? '<span class="chip go">En cours</span>' : '<span class="chip">' + esc(e.niveau) + "</span>");
    return '<a class="card" href="#' + e.id + '" data-fam="' + e.famille + '"><div class="row1"><span class="c">' + esc(e.code) + "</span>" + chip + "</div><h3>" + esc(e.titre) + '</h3><div class="meta"><span>' + qs.length + " questions</span><span>" + e.domaines.length + " domaines</span><span>" + st.seen + "/" + qs.length + ' vues</span></div><div class="meter"><i style="width:' + Math.round(100 * st.seen / qs.length) + '%"></i></div></a>';
  }
  function viewHome() {
    var nq = D.examens.reduce(function (a, e) { return a + examQuestions(e).length; }, 0);
    var html =
      '<div class="main">' +
      '<section class="hero"><div><h1>Révise ta certification <em>Claude, Copilot, GitHub, Power Platform ou Azure</em>.</h1>' +
      '<p class="lede">Une fiche par domaine du programme officiel, des questions d\'entraînement corrigées avec leur source, et un examen blanc chronométré noté sur 1000.</p></div>' +
      '<div class="figs"><div><b>' + D.examens.length + "</b><span>examens</span></div><div><b>" + nq + "</b><span>questions</span></div><div><b>" + D.formations.length + "</b><span>cours Claude</span></div></div></section>" +
      D.familles.map(function (f) {
        var exs = famExams(f.id);
        var cards = exs.map(examCard).join("");
        if (f.id === "claude" && D.formations.length) {
          cards += '<a class="card formation" href="#formation-m1" data-fam="claude"><div class="row1"><span class="c">Formation</span><span class="chip">' + D.formations.length + ' cours</span></div><h3>Les cours Claude Academy, résumés en français</h3><div class="meta"><span>Claude 101, Claude Code, MCP, API</span></div></a>';
        }
        return '<section class="fam-block" data-fam="' + f.id + '" id="sec-' + f.id + '"><div class="fam-head"><h2>' + esc(f.nom) + "</h2><p>" + esc(f.intro) + '</p><a class="small" href="#famille-' + f.id + '">Voir la famille →</a></div><div class="cards">' + (cards || '<p class="small">Examens en préparation.</p>') + "</div></section>";
      }).join("") +
      '<section class="how"><div><h3>1. Lis la fiche</h3><p>Chaque examen suit son programme officiel « Skills measured », domaine par domaine, avec le poids de chaque domaine.</p></div>' +
      "<div><h3>2. Entraîne-toi</h3><p>Correction immédiate, explication et lien vers la documentation officielle. L'ordre des réponses change à chaque passage.</p></div>" +
      "<div><h3>3. Passe l'examen blanc</h3><p>Chronomètre, correction à la fin, score sur 1000 et résultat par domaine pour savoir quoi revoir.</p></div></section>" +
      '<p class="small">Questions originales rédigées à partir des programmes officiels et de la documentation Microsoft et Anthropic. Ce ne sont pas des questions d\'examen réelles. Le score sur 1000 est une estimation : l\'éditeur calcule son score autrement. Ta progression reste dans ce navigateur.</p>' +
      '<div class="reset-box" id="reset"><button class="btn" id="reset-ask" type="button">Remettre ma progression à zéro</button><div class="reset-confirm" id="reset-confirm" hidden><p>Effacer toutes tes réponses, examens blancs et sections lues dans ce navigateur ? C\'est définitif.</p><div class="row"><button class="btn danger" id="reset-yes" type="button">Tout effacer</button><button class="btn" id="reset-no" type="button">Annuler</button></div></div><p class="small" id="reset-done" hidden role="status">Progression effacée.</p></div>' +
      "</div>";
    setView(html);
    var ask = document.getElementById("reset-ask"), box = document.getElementById("reset-confirm");
    ask.addEventListener("click", function () { ask.hidden = true; box.hidden = false; document.getElementById("reset-no").focus(); });
    document.getElementById("reset-no").addEventListener("click", function () { box.hidden = true; ask.hidden = false; ask.focus(); });
    document.getElementById("reset-yes").addEventListener("click", function () { S = blank(); save(); viewHome(); document.getElementById("reset-done").hidden = false; });
    document.title = "Prépa Certifs";
  }

  function viewFamily(f) {
    var exs = famExams(f.id);
    var html = '<div class="main">' + crumbs([["Accueil", "accueil"], [f.nom]]) +
      '<header class="page-head"><span class="code-tag">' + esc(f.editeur) + "</span><h1>" + esc(f.nom) + '</h1><p class="lede">' + esc(f.intro) + "</p></header>" +
      '<div class="cards">' + exs.map(examCard).join("") + "</div>";
    if (f.id === "claude" && D.formations.length) {
      html += '<section class="fam-block"><div class="fam-head"><h2>Formation : les cours Claude Academy</h2><p>Résumés en français, exercices et quiz. Ce sont les cours qu\'Anthropic recommande pour préparer CCAR-F.</p></div><div class="cards">' +
        D.formations.map(function (m) {
          var st = stats("formation-m" + m.n, formationQuestions(m)), rd = m.sections.filter(function (s) { return S.read[s.id]; }).length;
          return '<a class="card" href="#formation-m' + m.n + '" data-fam="claude"><div class="row1"><span class="c">Cours ' + m.n + '</span><span class="chip">' + esc(m.duration) + "</span></div><h3>" + esc(m.title) + '</h3><div class="meta"><span>' + rd + "/" + m.sections.length + " sections lues</span><span>Quiz : " + st.ok + "/" + m.quiz.length + '</span></div><div class="meter"><i style="width:' + Math.round(100 * rd / m.sections.length) + '%"></i></div></a>';
        }).join("") + "</div></section>";
    }
    setView(html + "</div>", f.id);
    document.title = f.nom + " · Prépa Certifs";
  }

  // ---------- Examen : sommaire, présentation, fiches ----------
  function examSide(e, cur) {
    var qs = examQuestions(e), st = stats(e.id, qs);
    var h = '<span class="lbl">' + esc(e.code) + "</span>" +
      '<a href="#' + e.id + '" class="' + (cur === "" ? "active" : "") + '">Présentation</a>' +
      '<span class="lbl">Fiches par domaine</span>' +
      e.domaines.map(function (d, i) {
        return '<a href="#' + e.id + "-" + d.id + '" class="' + (cur === d.id ? "active" : "") + '"><span>' + esc(d.nom) + "</span><small>" + pw(d) + " %</small></a>";
      }).join("") +
      '<span class="lbl">S\'entraîner</span>' +
      '<a href="#' + e.id + '-entrainement" class="' + (cur === "entrainement" ? "active" : "") + '"><span>Toutes les questions</span><small>' + qs.length + "</small></a>" +
      (st.missed.length ? '<a href="#' + e.id + '-erreurs" class="' + (cur === "erreurs" ? "active" : "") + '"><span>Revoir mes erreurs</span><small>' + st.missed.length + "</small></a>" : "") +
      '<a href="#' + e.id + '-examen" class="' + (cur === "examen" ? "active" : "") + '"><span>Examen blanc</span><small>' + Math.round(qs.length * e.minutes_par_question) + " min</small></a>";
    return h;
  }
  function examHeader(e, sub) {
    var f = FAM[e.famille];
    return crumbs([["Accueil", "accueil"], [f.nom, "famille-" + f.id], [e.code, sub ? e.id : null]].concat(sub ? [[sub]] : []));
  }
  function viewExam(e) {
    var qs = examQuestions(e), st = stats(e.id, qs), best = bestMock(e.id), mocks = S.mocks[e.id] || [];
    var r = S.q[e.id] || {};
    var doms = e.domaines.map(function (d, i) {
      var dq = d.questions, seen = dq.filter(function (q) { return r[q.n] != null; }).length, ok = dq.filter(function (q) { return r[q.n] === true; }).length;
      return '<a class="dom" href="#' + e.id + "-" + d.id + '"><span class="k">' + d.id.toUpperCase() + "</span><div><div>" + esc(d.nom) + '</div><div class="w">' + pw(d) + " % de l'examen · " + plural(dq.length, "question") + '</div></div><div class="pct"><span>' + (seen ? ok + "/" + dq.length + " justes" : "Pas commencé") + '</span><div class="meter"><i style="width:' + Math.round(100 * ok / dq.length) + '%"></i></div></div></a>';
    }).join("");
    var cur = S.cur && S.cur.id === e.id;
    var main = examHeader(e) +
      '<header class="page-head"><span class="code-tag">' + esc(e.code) + " · " + esc(e.niveau) + " · " + esc(e.editeur) + "</span><h1>" + esc(e.titre) + "</h1></header>" +
      (e.intro ? '<div class="prose">' + md(e.intro) + "</div>" : "") +
      '<div class="actions">' +
      '<a class="action main-act" href="#' + e.id + '-examen"><b>' + (cur ? "Reprendre l'examen blanc" : "Examen blanc") + "</b><span>" + qs.length + " questions · " + Math.round(qs.length * e.minutes_par_question) + " min · seuil " + e.seuil + "/1000</span></a>" +
      '<a class="action" href="#' + e.id + '-entrainement"><b>Entraînement</b><span>Correction après chaque question · ' + st.seen + "/" + qs.length + " déjà vues</span></a>" +
      (st.missed.length ? '<a class="action" href="#' + e.id + '-erreurs"><b>Revoir mes erreurs</b><span>' + plural(st.missed.length, "question") + " ratée" + (st.missed.length > 1 ? "s" : "") + " à reprendre</span></a>" : "") +
      "</div>" +
      (mocks.length ? '<p class="small">Examens blancs : ' + mocks.length + " passé" + (mocks.length > 1 ? "s" : "") + ", meilleur score " + best + "/1000, dernier " + mocks[mocks.length - 1].score + "/1000.</p>" : "") +
      "<h2 style=\"font-size:1.2rem\">Programme officiel</h2>" +
      '<div class="domains">' + doms + "</div>" +
      '<p class="small">Programme « Skills measured » du ' + esc(e.programme_date) + ". Vérifie la date sur le guide officiel avant ton examen : Microsoft le met à jour régulièrement.</p>" +
      '<div class="links"><a class="btn" href="' + esc(e.url) + '">Page officielle de la certification ↗</a><a class="btn" href="' + esc(e.programme_url) + '">Guide d\'étude officiel ↗</a></div>';
    setView(sideWrap(examSide(e, ""), main), e.famille);
    bindSide();
    document.title = e.code + " · Prépa Certifs";
  }
  function viewDomain(e, d) {
    var idx = e.domaines.indexOf(d), prev = e.domaines[idx - 1], next = e.domaines[idx + 1];
    var main = examHeader(e, d.nom) +
      '<header class="page-head"><span class="code-tag">' + esc(e.code) + " · " + d.id.toUpperCase() + " · " + pw(d) + " % de l'examen</span><h1>" + esc(d.nom) + "</h1></header>" +
      '<article class="prose">' + md(d.fiche) + "</article>" +
      '<div class="row"><a class="btn dark" href="#' + e.id + "-" + d.id + '-entrainement">S\'entraîner sur ce domaine (' + d.questions.length + ")</a>" +
      (prev ? '<a class="btn" href="#' + e.id + "-" + prev.id + '">← ' + esc(prev.id.toUpperCase()) + "</a>" : "") +
      (next ? '<a class="btn" href="#' + e.id + "-" + next.id + '">' + esc(next.id.toUpperCase()) + " →</a>" : '<a class="btn" href="#' + e.id + '-examen">Examen blanc →</a>') + "</div>";
    setView(sideWrap(examSide(e, d.id), '<div class="col">' + main + "</div>"), e.famille);
    bindSide();
    document.title = d.nom + " · " + e.code;
  }

  // ---------- Entraînement (correction immédiate) ----------
  var P = null;
  function startPractice(o) {
    if (!o.items.length) { location.hash = "#" + o.back; return; }
    P = { o: o, items: shuffle(o.items.slice()).map(function (q) { return { q: q, opts: shuffle(q.options.slice()).map(function (x, k) { return { l: "abcd"[k], orig: x.l, t: x.t }; }) }; }), i: 0, picks: [] };
    drawPQ();
  }
  function pLayout(inner) {
    var o = P.o;
    setView(o.side ? sideWrap(o.side, '<div class="col">' + inner + "</div>") : '<div class="main"><div class="col">' + inner + "</div></div>", o.fam);
    bindSide();
  }
  function drawPQ() {
    var o = P.o, it = P.items[P.i], q = it.q, n = P.items.length;
    var good = P.picks.filter(function (p, j) { return p === P.items[j].q.a; }).length;
    pLayout(o.crumbs + '<header class="page-head"><span class="code-tag">' + esc(o.label) + '</span><div class="qhead"><h1>' + esc(o.title) + '</h1><span class="qcount">' + (P.i + 1) + " / " + n + " · " + plural(good, "bonne") + '</span></div><div class="qbar"><i style="width:' + Math.round(100 * P.i / n) + '%"></i></div></header>' +
      '<div class="qcard"><span class="qtag">' + esc(q.domNom) + " · Q" + q.n + '</span><p class="qtext">' + mi(q.q) + '</p><div class="opts" role="group" aria-label="Réponses">' +
      it.opts.map(function (x) { return '<button type="button" class="opt" data-orig="' + x.orig + '"><span class="l">' + x.l + ")</span><span>" + mi(x.t) + "</span></button>"; }).join("") +
      '</div><div id="after"></div></div><p class="small">Clavier : <span class="kbd">a</span> à <span class="kbd">d</span> pour répondre, <span class="kbd">Entrée</span> pour continuer.</p>');
    view.querySelectorAll(".opt").forEach(function (b) { b.addEventListener("click", function () { pAnswer(b.dataset.orig); }); });
  }
  function pAnswer(orig) {
    if (!P || P.picks.length > P.i) return;
    var it = P.items[P.i], q = it.q, ok = orig === q.a;
    P.picks.push(orig);
    res(P.o.key)[q.n] = ok; save();
    var right = it.opts.filter(function (x) { return x.orig === q.a; })[0];
    view.querySelectorAll(".opt").forEach(function (b) {
      b.disabled = true;
      if (b.dataset.orig === q.a) b.classList.add("right"); else if (b.dataset.orig === orig) b.classList.add("wrong"); else b.classList.add("dim");
    });
    var last = P.i === P.items.length - 1;
    document.getElementById("after").innerHTML = '<div class="verdict ' + (ok ? "ok" : "ko") + '"><b>' + (ok ? "Bonne réponse." : "Réponse attendue : " + right.l + ")") + "</b><span>" + mi(q.why) + "</span>" + (q.src ? '<a href="' + esc(q.src) + '" target="_blank" rel="noopener">Source officielle ↗</a>' : "") + "</div>" +
      '<div class="row" style="margin-top:14px"><button class="btn primary" id="next" type="button">' + (last ? "Voir le bilan" : "Question suivante →") + "</button></div>";
    var nx = document.getElementById("next"); nx.addEventListener("click", pNext); nx.focus({ preventScroll: true });
  }
  function pNext() { if (!P || P.picks.length <= P.i) return; if (P.i < P.items.length - 1) { P.i++; drawPQ(); } else pDone(); }
  function pDone() {
    var o = P.o, n = P.items.length;
    var wrong = P.items.filter(function (it, j) { return P.picks[j] !== it.q.a; }).map(function (it) { return it.q; });
    var score = n - wrong.length;
    P.done = true;
    pLayout(o.crumbs + '<header class="page-head"><span class="code-tag">' + esc(o.label) + "</span><h1>Bilan : " + score + " / " + n + '</h1><p class="lede">' + (wrong.length ? "Relis les explications ci-dessous, puis reprends tes erreurs." : "Aucune erreur sur cette série.") + "</p></header>" +
      (wrong.length ? '<div class="review">' + wrong.map(function (q) {
        var a = q.options.filter(function (x) { return x.l === q.a; })[0];
        return "<details open><summary><span class=\"st ko-t\">✗</span><span>" + mi(q.q) + '</span></summary><div class="body"><p><b>Réponse :</b> ' + mi(a ? a.t : "") + "</p><p>" + mi(q.why) + "</p>" + (q.src ? '<p><a href="' + esc(q.src) + '" target="_blank" rel="noopener">Source officielle ↗</a></p>' : "") + "</div></details>";
      }).join("") + "</div>" : "") +
      '<div class="row">' + (wrong.length ? '<a class="btn primary" href="#' + o.errHash + '">Revoir mes erreurs (' + wrong.length + ")</a>" : "") + '<button class="btn" id="again" type="button">Recommencer cette série</button><a class="btn" href="#' + o.back + '">Retour</a></div>');
    document.getElementById("again").addEventListener("click", function () { startPractice(o); });
    var err = view.querySelector('a[href="#' + o.errHash + '"]');
    if (err && location.hash === "#" + o.errHash) err.addEventListener("click", function (ev) { ev.preventDefault(); routeTo(o.errHash); });
  }

  // ---------- Examen blanc ----------
  var M = null, tick = null;
  function newMock(e) {
    var qs = shuffle(examQuestions(e));
    return { id: e.id, start: Date.now(), dur: Math.round(qs.length * e.minutes_par_question * 60), i: 0,
      items: qs.map(function (q) { return { n: q.n, opts: shuffle(["a", "b", "c", "d"]) }; }), ans: {}, flag: {} };
  }
  function viewMockIntro(e) {
    var qs = examQuestions(e), mins = Math.round(qs.length * e.minutes_par_question);
    var cur = S.cur && S.cur.id === e.id;
    var main = examHeader(e, "Examen blanc") +
      '<header class="page-head"><span class="code-tag">' + esc(e.code) + '</span><h1>Examen blanc</h1><p class="lede">' + qs.length + " questions dans un ordre aléatoire, " + mins + " minutes. Tu peux naviguer entre les questions et en marquer pour y revenir. La correction arrive à la fin, avec un score sur 1000 et le détail par domaine.</p></header>" +
      '<div class="notice">Seuil de réussite : ' + e.seuil + "/1000. Ici le score est proportionnel au nombre de bonnes réponses ; le vrai examen utilise un score pondéré, et ses questions sont différentes.</div>" +
      '<div class="row">' + (cur ? '<button class="btn dark" id="resume" type="button">Reprendre (' + fmtTime(S.cur.dur - (Date.now() - S.cur.start) / 1000) + " restantes)</button>" : "") +
      '<button class="btn ' + (cur ? "" : "dark") + '" id="go" type="button">' + (cur ? "Recommencer à zéro" : "Commencer l'examen blanc") + "</button></div>";
    var hist = S.mocks[e.id] || [];
    if (hist.length) main += '<h2 style="font-size:1.1rem">Tes examens blancs</h2><div class="review">' + hist.slice().reverse().map(function (m) {
      return '<details><summary><span class="st ' + (m.score >= e.seuil ? "ok-t" : "ko-t") + '">' + m.score + "</span><span>" + esc(new Date(m.d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })) + " · " + m.ok + "/" + m.total + " bonnes réponses</span></summary></details>";
    }).join("") + "</div>";
    setView(sideWrap(examSide(e, "examen"), '<div class="col">' + main + "</div>"), e.famille);
    bindSide();
    if (cur) document.getElementById("resume").addEventListener("click", function () { M = S.cur; drawMock(); });
    document.getElementById("go").addEventListener("click", function () { M = S.cur = newMock(e); save(); drawMock(); });
    document.title = "Examen blanc · " + e.code;
  }
  function mockExam() { return EX[M.id]; }
  function qByN(e, n) { var all = examQuestions(e); for (var i = 0; i < all.length; i++) if (all[i].n === n) return all[i]; return null; }
  function drawMock() {
    var e = mockExam(), it = M.items[M.i], q = qByN(e, it.n), n = M.items.length, answered = Object.keys(M.ans).length;
    var optsByL = {}; q.options.forEach(function (x) { optsByL[x.l] = x; });
    var html = '<div class="main"><div class="col">' +
      '<div class="mock-bar"><div><b>' + esc(e.code) + '</b> <span class="small">· ' + answered + "/" + n + ' répondues</span></div><span class="timer" id="timer">--:--</span><button class="btn" id="finish" type="button">Terminer</button></div>' +
      '<div class="qcard"><div class="qhead"><span class="qtag">Question ' + (M.i + 1) + " / " + n + '</span><label class="small"><input type="checkbox" id="flag" ' + (M.flag[it.n] ? "checked" : "") + "> Marquer pour revoir</label></div>" +
      '<p class="qtext">' + mi(q.q) + '</p><div class="opts" role="radiogroup" aria-label="Réponses">' +
      it.opts.map(function (orig, k) { return '<button type="button" role="radio" aria-checked="' + (M.ans[it.n] === orig) + '" class="opt' + (M.ans[it.n] === orig ? " picked" : "") + '" data-orig="' + orig + '"><span class="l">' + "abcd"[k] + ")</span><span>" + mi(optsByL[orig].t) + "</span></button>"; }).join("") +
      '</div><div class="row"><button class="btn" id="prev" type="button" ' + (M.i ? "" : "disabled") + '>← Précédente</button><button class="btn primary" id="nextq" type="button">' + (M.i < n - 1 ? "Suivante →" : "Terminer") + "</button></div></div>" +
      '<div class="grid-nav" aria-label="Aller à une question">' + M.items.map(function (x, k) { return '<button type="button" data-k="' + k + '" class="' + (M.ans[x.n] ? "ans " : "") + (M.flag[x.n] ? "flag " : "") + (k === M.i ? "cur" : "") + '" aria-label="Question ' + (k + 1) + '">' + (k + 1) + "</button>"; }).join("") + "</div>" +
      '<p class="small">Pastille orange : question marquée. Clavier : <span class="kbd">a</span>–<span class="kbd">d</span> pour répondre, flèches pour naviguer.</p>' +
      '<div id="confirm" hidden class="reset-confirm"><p id="confirm-txt"></p><div class="row"><button class="btn dark" id="really" type="button">Corriger maintenant</button><button class="btn" id="cancel" type="button">Continuer l\'examen</button></div></div>' +
      "</div></div>";
    view.innerHTML = html; view.setAttribute("data-fam", e.famille);
    view.querySelectorAll(".opt").forEach(function (b) { b.addEventListener("click", function () { mPick(b.dataset.orig); }); });
    view.querySelectorAll(".grid-nav button").forEach(function (b) { b.addEventListener("click", function () { M.i = +b.dataset.k; save(); drawMock(); }); });
    document.getElementById("flag").addEventListener("change", function (ev) { M.flag[it.n] = ev.target.checked; save(); drawMock(); });
    document.getElementById("prev").addEventListener("click", function () { if (M.i) { M.i--; save(); drawMock(); } });
    document.getElementById("nextq").addEventListener("click", function () { if (M.i < n - 1) { M.i++; save(); drawMock(); } else askFinish(); });
    document.getElementById("finish").addEventListener("click", askFinish);
    document.getElementById("cancel").addEventListener("click", function () { document.getElementById("confirm").hidden = true; });
    document.getElementById("really").addEventListener("click", finishMock);
    startTick();
    document.title = "Examen blanc en cours · " + e.code;
  }
  function mPick(orig) { var it = M.items[M.i]; M.ans[it.n] = orig; save(); drawMock(); }
  function askFinish() {
    var left = M.items.length - Object.keys(M.ans).length, flagged = M.items.filter(function (x) { return M.flag[x.n]; }).length;
    document.getElementById("confirm-txt").textContent = (left ? plural(left, "question") + " sans réponse" + (left > 1 ? "s" : "") + " (comptée" + (left > 1 ? "s" : "") + " fausse" + (left > 1 ? "s" : "") + "). " : "Toutes les questions ont une réponse. ") + (flagged ? plural(flagged, "question") + " marquée" + (flagged > 1 ? "s" : "") + " pour revoir. " : "") + "Corriger l'examen ?";
    var c = document.getElementById("confirm"); c.hidden = false; document.getElementById("really").focus();
  }
  function startTick() {
    clearInterval(tick);
    function upd() {
      if (!M) { clearInterval(tick); return; }
      var left = M.dur - (Date.now() - M.start) / 1000, t = document.getElementById("timer");
      if (t) { t.textContent = fmtTime(left); t.classList.toggle("low", left < 300); }
      if (left <= 0) finishMock();
    }
    upd(); tick = setInterval(upd, 1000);
  }
  function finishMock() {
    clearInterval(tick);
    var e = mockExam(), all = examQuestions(e), byN = {}; all.forEach(function (q) { byN[q.n] = q; });
    var ok = 0, perDom = {};
    e.domaines.forEach(function (d) { perDom[d.id] = { nom: d.nom, ok: 0, total: 0 }; });
    var r = res(e.id);
    M.items.forEach(function (x) { var q = byN[x.n], good = M.ans[x.n] === q.a; if (good) ok++; perDom[q.dom].total++; if (good) perDom[q.dom].ok++; r[x.n] = good; });
    var total = M.items.length, score = Math.round(1000 * ok / total);
    (S.mocks[e.id] = S.mocks[e.id] || []).push({ d: Date.now(), score: score, ok: ok, total: total });
    if (S.mocks[e.id].length > 20) S.mocks[e.id].shift();
    var done = M; S.cur = null; M = null; save();
    var pass = score >= e.seuil;
    var doms = e.domaines.map(function (d) {
      var p = perDom[d.id], pct = p.total ? Math.round(100 * p.ok / p.total) : 0;
      return '<div class="' + (pct < 70 ? "weak" : "") + '"><a href="#' + e.id + "-" + d.id + '">' + esc(p.nom) + '</a><div class="meter"><i style="width:' + pct + '%"></i></div><span>' + p.ok + "/" + p.total + "</span></div>";
    }).join("");
    var rev = done.items.map(function (x, k) {
      var q = byN[x.n], pick = done.ans[x.n], good = pick === q.a, a = q.options.filter(function (o) { return o.l === q.a; })[0], p = q.options.filter(function (o) { return o.l === pick; })[0];
      return '<details' + (good ? "" : " open") + '><summary><span class="st ' + (good ? "ok-t" : "ko-t") + '">' + (good ? "✓" : "✗") + " " + (k + 1) + "</span><span>" + mi(q.q) + '</span></summary><div class="body">' +
        (good ? "" : "<p><b>Ta réponse :</b> " + (p ? mi(p.t) : "<i>aucune</i>") + "</p>") + "<p><b>Bonne réponse :</b> " + mi(a.t) + "</p><p>" + mi(q.why) + '</p><p class="small">' + esc(q.domNom) + ' · <a href="' + esc(q.src) + '" target="_blank" rel="noopener">Source officielle ↗</a></p></div></details>';
    }).join("");
    var main = examHeader(e, "Résultat de l'examen blanc") +
      '<header class="page-head"><span class="code-tag">' + esc(e.code) + " · Examen blanc</span><h1>" + (pass ? "Réussi" : "Pas encore") + '</h1></header><div class="score-big"><b>' + score + '</b><span class="chip ' + (pass ? "ok" : "ko") + '">seuil ' + e.seuil + '</span><span class="small">' + ok + "/" + total + " bonnes réponses</span></div>" +
      '<h2 style="font-size:1.1rem">Par domaine</h2><div class="dom-res">' + doms + '</div><p class="small">En rouge, les domaines sous 70 % : relis leur fiche.</p>' +
      '<div class="row"><a class="btn dark" href="#' + e.id + '-erreurs">Revoir mes erreurs</a><a class="btn" href="#' + e.id + '-examen">Nouvel examen blanc</a></div>' +
      '<h2 style="font-size:1.1rem">Correction détaillée</h2><div class="review">' + rev + "</div>";
    setView(sideWrap(examSide(e, "examen"), '<div class="col">' + main + "</div>"), e.famille);
    bindSide();
    if (location.hash !== "#" + e.id + "-resultat") history.replaceState(null, "", "#" + e.id + "-resultat");
    document.title = "Résultat " + score + " · " + e.code;
  }

  // ---------- Formations Claude (carnet) ----------
  function formationSide(m, cur) {
    return D.formations.map(function (f) {
      var on = f.n === m.n;
      var h = '<a href="#formation-m' + f.n + '" class="' + (on && cur === "" ? "active" : "") + '"><span>' + f.n + ". " + esc(f.title) + "</span></a>";
      if (on) {
        h += f.sections.map(function (s) { return '<a href="#' + s.id.replace(/^m(\d+)-/, "formation-m$1-") + '" class="' + (S.read[s.id] ? "read " : "") + (cur === s.id ? "active" : "") + '" style="padding-left:22px"><span>' + esc(s.title.replace(/^(Leçons?|Parties?|Partie)\s+[^—]+—\s*/, "")) + "</span></a>"; }).join("");
        h += '<a href="#formation-m' + f.n + '-quiz" class="' + (cur === "quiz" ? "active" : "") + '" style="padding-left:22px"><span>Quiz</span><small>' + f.quiz.length + "</small></a>";
      }
      return h;
    }).join("");
  }
  function fCrumbs(m, sub) { return crumbs([["Accueil", "accueil"], ["Claude", "famille-claude"], ["Cours " + m.n, sub ? "formation-m" + m.n : null]].concat(sub ? [[sub]] : [])); }
  function viewFormation(m) {
    var main = fCrumbs(m) + '<header class="page-head"><span class="code-tag">Formation Claude · cours ' + m.n + " · " + esc(m.duration) + "</span><h1>" + esc(m.title) + '</h1></header><div class="prose">' + md(m.intro) + "</div>" +
      '<div class="actions">' + m.sections.map(function (s, i) { return '<a class="action" href="#' + s.id.replace(/^m(\d+)-/, "formation-m$1-") + '"><b>' + esc(s.title) + "</b><span>" + (S.read[s.id] ? "Lue" : "À lire") + "</span></a>"; }).join("") +
      '<a class="action main-act" href="#formation-m' + m.n + '-quiz"><b>Quiz du cours</b><span>' + m.quiz.length + " questions</span></a></div>";
    setView(sideWrap(formationSide(m, ""), '<div class="col">' + main + "</div>"), "claude");
    bindSide();
    document.title = m.title + " · Formation Claude";
  }
  function viewFSection(m, s) {
    var idx = m.sections.indexOf(s), next = m.sections[idx + 1];
    var main = fCrumbs(m, s.title) + '<header class="page-head"><span class="code-tag">Cours ' + m.n + " · " + esc(m.title) + "</span><h1>" + esc(s.title) + "</h1></header>" +
      '<article class="prose">' + md(s.md) + "</article>" +
      '<div class="row"><button class="btn" id="mark" type="button"></button>' + (next ? '<a class="btn" href="#' + next.id.replace(/^m(\d+)-/, "formation-m$1-") + '">Section suivante →</a>' : '<a class="btn dark" href="#formation-m' + m.n + '-quiz">Quiz du cours →</a>') + "</div>";
    setView(sideWrap(formationSide(m, s.id), '<div class="col">' + main + "</div>"), "claude");
    bindSide();
    view.querySelectorAll(".prose input[type=checkbox]").forEach(function (c) { c.disabled = false; });
    var b = document.getElementById("mark");
    function paint() { var r = !!S.read[s.id]; b.textContent = r ? "✓ Section lue" : "Marquer comme lue"; b.className = "btn" + (r ? " done" : ""); }
    paint(); b.addEventListener("click", function () { S.read[s.id] = !S.read[s.id]; save(); paint(); });
    document.title = s.title + " · Formation Claude";
  }

  // ---------- Routage ----------
  function routeTo(h) { if (location.hash === "#" + h) route(); else location.hash = "#" + h; }
  function route() {
    var h = decodeURIComponent((location.hash || "").replace(/^#/, "")) || "accueil", m;
    if (M && !(h === M.id + "-examen")) { clearInterval(tick); M = null; }
    P = null;
    var fam = null;
    if ((m = h.match(/^famille-(.+)$/)) && FAM[m[1]]) { fam = m[1]; viewFamily(FAM[m[1]]); }
    else if ((m = h.match(/^formation-m(\d+)(?:-(.+))?$/)) && D.formations[+m[1] - 1]) {
      fam = "claude";
      var fm = D.formations[+m[1] - 1], rest = m[2] || "", key = "formation-m" + fm.n;
      var side = function (c) { return formationSide(fm, c); };
      if (!rest) viewFormation(fm);
      else if (/^s\d+$/.test(rest) && fm.sections.filter(function (s) { return s.id === "m" + fm.n + "-" + rest; })[0]) viewFSection(fm, fm.sections.filter(function (s) { return s.id === "m" + fm.n + "-" + rest; })[0]);
      else if (rest === "quiz" || rest === "erreurs") {
        var all = formationQuestions(fm), items = rest === "quiz" ? all : stats(key, all).missed;
        startPractice({ key: key, items: items, back: "formation-m" + fm.n, errHash: "formation-m" + fm.n + "-erreurs", fam: "claude", side: side("quiz"),
          crumbs: fCrumbs(fm, rest === "quiz" ? "Quiz" : "Erreurs"), label: "Formation Claude · cours " + fm.n, title: rest === "quiz" ? "Quiz du cours" : "Revoir mes erreurs" });
      } else viewFormation(fm);
    } else {
      var e = null;
      D.examens.forEach(function (x) { if (h === x.id || h.indexOf(x.id + "-") === 0) e = x; });
      if (e) {
        fam = e.famille;
        var r = h.slice(e.id.length + 1), dm = r.match(/^(d\d+)(-entrainement)?$/), dom = dm ? e.domaines.filter(function (d) { return d.id === dm[1]; })[0] : null;
        var qs = examQuestions(e);
        var base = { key: e.id, back: e.id, errHash: e.id + "-erreurs", fam: e.famille, label: e.code + " · " + e.titre };
        if (!r) viewExam(e);
        else if (dom && !dm[2]) viewDomain(e, dom);
        else if (dom && dm[2]) startPractice(Object.assign({}, base, { items: qs.filter(function (q) { return q.dom === dom.id; }), side: examSide(e, dom.id), crumbs: examHeader(e, dom.nom), title: "Entraînement : " + dom.nom }));
        else if (r === "entrainement") startPractice(Object.assign({}, base, { items: qs, side: examSide(e, "entrainement"), crumbs: examHeader(e, "Entraînement"), title: "Entraînement complet" }));
        else if (r === "erreurs") {
          var miss = stats(e.id, qs).missed;
          if (!miss.length) { location.replace("#" + e.id); return; }
          startPractice(Object.assign({}, base, { items: miss, side: examSide(e, "erreurs"), crumbs: examHeader(e, "Erreurs"), title: "Revoir mes erreurs" }));
        }
        else if (r === "examen") { if (M && M.id === e.id) drawMock(); else viewMockIntro(e); }
        else if (r === "resultat") viewMockIntro(e);
        else viewExam(e);
      } else { h = "accueil"; viewHome(); }
    }
    renderFams(fam);
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey || /input|textarea/i.test((ev.target.tagName || "")) && ev.target.type !== "checkbox") return;
    var k = ev.key.toLowerCase();
    if (P && !P.done) {
      if (/^[a-d]$/.test(k) && P.picks.length === P.i) { ev.preventDefault(); var x = P.items[P.i].opts.filter(function (o) { return o.l === k; })[0]; if (x) pAnswer(x.orig); }
      else if (k === "enter" && P.picks.length > P.i && document.activeElement && document.activeElement.id !== "next") { ev.preventDefault(); pNext(); }
    } else if (M) {
      if (/^[a-d]$/.test(k)) { ev.preventDefault(); mPick(M.items[M.i].opts["abcd".indexOf(k)]); }
      else if (k === "arrowright" && M.i < M.items.length - 1) { M.i++; save(); drawMock(); }
      else if (k === "arrowleft" && M.i > 0) { M.i--; save(); drawMock(); }
    }
  });
  window.addEventListener("hashchange", route);

  fetch("data.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    D = d; d.familles.forEach(function (f) { FAM[f.id] = f; }); d.examens.forEach(function (e) { EX[e.id] = e; });
    route();
  }).catch(function () {
    view.innerHTML = '<p class="notice">Le contenu n\'a pas pu être chargé. Recharge la page ; si le problème continue, le fichier data.json manque dans la publication.</p>';
  });
})();
</script>
</body>
</html>
